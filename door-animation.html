<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ornate 3D Portal Door</title>
  <style>
    :root {
      --metal-dark: #121214;
      --metal-base: #1f2024;
      --metal-light: #34373d;
      --gold-accent: #8a7343;
      --gold-bright: #d4af37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #23252b 0%, #0d0e11 100%);
      font-family: 'Cinzel', serif, system-ui;
      overflow: hidden;
    }

    /* Scene Perspective Wrapper */
    .portal-stage {
      perspective: 1600px;
      perspective-origin: 50% 50%;
      cursor: pointer;
    }

    /* Exterior Frame & Architrave */
    .door-frame {
      position: relative;
      width: 440px;
      height: 600px;
      background: linear-gradient(180deg, #2b2d33 0%, #151618 100%);
      padding: 60px 36px 0 36px;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(255, 255, 255, 0.05),
        inset 0 2px 4px rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    /* Classical Top Cornice */
    .frame-cornice {
      position: absolute;
      top: 0;
      left: -20px;
      right: -20px;
      height: 52px;
      background: linear-gradient(180deg, #3a3d45 0%, #1c1d22 60%, #141517 100%);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
      border-top: 3px solid #4a4e58;
      border-bottom: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }

    .frieze-pattern {
      width: 85%;
      height: 16px;
      background: repeating-linear-gradient(
        90deg,
        #1c1d22 0px,
        #1c1d22 10px,
        var(--gold-accent) 12px,
        #1c1d22 14px
      );
      opacity: 0.7;
      border-radius: 2px;
    }

    /* Side Jamb Panels */
    .jamb-left, .jamb-right {
      position: absolute;
      top: 52px;
      bottom: 0;
      width: 36px;
      background: linear-gradient(90deg, #18191c, #26282e, #141518);
      border-top: 1px solid #3a3d45;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .jamb-left { left: 0; }
    .jamb-right { right: 0; }

    .jamb-filigree {
      width: 10px;
      height: 80%;
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 10px;
      background: repeating-radial-gradient(circle, #2d2f36 0, #141518 4px, transparent 6px);
    }

    /* Doorway Opening & Inner Room Behind */
    .door-opening {
      position: relative;
      width: 100%;
      height: 100%;
      background: #050507;
      box-shadow: inset 0 0 40px #000;
      transform-style: preserve-3d;
      overflow: visible;
    }

    .inner-room-reveal {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 20px;
      background: radial-gradient(circle, #3d321d 0%, #0a0a0c 80%);
      z-index: 1;
    }

    .inner-room-reveal h2 {
      font-size: 1.4rem;
      letter-spacing: 3px;
      color: var(--gold-bright);
      margin-bottom: 8px;
    }

    .inner-room-reveal p {
      font-size: 0.8rem;
      color: #b3b3b3;
      letter-spacing: 1px;
    }

    /* 3D Leaf Panels */
    .door-leaf {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      background: linear-gradient(135deg, #24252a 0%, #151619 100%);
      border: 2px solid #33363e;
      z-index: 2;
      transition: transform 1.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }

    .door-leaf.left {
      left: 0;
      transform-origin: left center;
      border-right: 1px solid #111;
    }

    .door-leaf.right {
      right: 0;
      transform-origin: right center;
      border-left: 1px solid #111;
    }

    /* Door Leaf Carved Details */
    .panel-inset {
      position: absolute;
      inset: 12px 10px;
      border: 2px solid #383b44;
      background: radial-gradient(circle at 100% 50%, #2a2c33 0%, #121316 70%);
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9);
      overflow: hidden;
    }

    .door-leaf.right .panel-inset {
      background: radial-gradient(circle at 0% 50%, #2a2c33 0%, #121316 70%);
    }

    /* Radial Medallion (Spans Across Both Leaves) */
    .mandala-half {
      position: absolute;
      top: 50%;
      width: 260px;
      height: 260px;
      margin-top: -130px;
      border-radius: 50%;
      border: 3px double rgba(212, 175, 55, 0.4);
      background: repeating-conic-gradient(
        from 0deg,
        rgba(212, 175, 55, 0.15) 0deg 10deg,
        transparent 10deg 20deg
      );
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }

    .door-leaf.left .mandala-half {
      right: -130px;
    }

    .door-leaf.right .mandala-half {
      left: -130px;
    }

    /* Handles */
    .door-handle {
      position: absolute;
      top: 50%;
      width: 10px;
      height: 60px;
      background: linear-gradient(90deg, #f7d070, #96742e, #574113);
      border-radius: 4px;
      box-shadow: 2px 4px 8px rgba(0, 0, 0, 0.6);
      transform: translateY(-50%);
      z-index: 5;
    }

    .door-leaf.left .door-handle {
      right: 12px;
    }

    .door-leaf.right .door-handle {
      left: 12px;
    }

    /* Active Open State */
    .portal-stage.open .door-leaf.left {
      transform: rotateY(-115deg);
    }

    .portal-stage.open .door-leaf.right {
      transform: rotateY(115deg);
    }
  </style>
</head>
<body>

  <div class="portal-stage" id="doorStage" title="Click to open or close">
    <div class="door-frame">
      <div class="frame-cornice">
        <div class="frieze-pattern"></div>
      </div>
      
      <div class="jamb-left"><div class="jamb-filigree"></div></div>
      <div class="jamb-right"><div class="jamb-filigree"></div></div>

      <div class="door-opening">
        <!-- Content Revealed Inside -->
        <div class="inner-room-reveal">
          <h2>WELCOME</h2>
          <p>ENTER THE SANCTUARY</p>
        </div>

        <!-- Left Leaf -->
        <div class="door-leaf left">
          <div class="panel-inset">
            <div class="mandala-half"></div>
          </div>
          <div class="door-handle"></div>
        </div>

        <!-- Right Leaf -->
        <div class="door-leaf right">
          <div class="panel-inset">
            <div class="mandala-half"></div>
          </div>
          <div class="door-handle"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const stage = document.getElementById('doorStage');
    stage.addEventListener('click', () => {
      stage.classList.toggle('open');
    });
  </script>
</body>
</html>
